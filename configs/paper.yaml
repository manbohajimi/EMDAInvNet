# Reproduction config for Kong et al., IEEE Sensors Journal 2026.
# source: explicit in the paper; engineering_default: paper does not disclose it.
seed: 2026
output_dir: outputs/paper_default

data:
  train_manifest: data/manifests/dataset_ii_train.csv
  val_manifest: data/manifests/dataset_ii_val.csv
  test_manifest: data/manifests/dataset_ii_test.csv
  input_key: clean_data
  target_key: mask
  input_shape: [64, 64, 64]       # source: Sections III-A and III-C
  input_min: -9.0                 # engineering_default inherited from 3DInvNet loader
  input_max: 9.0                  # engineering_default inherited from 3DInvNet loader
  target_min: 4.0                 # source: Dataset II background permittivity
  target_max: 27.0                # source: [44] Dataset I target range [8, 27]
  target_normalization: minmax    # engineering_default: paper has sigmoid but omits formula
  target_threshold_phys: 6.0      # midpoint between background 4 and minimum target 8
  num_workers: 2

model:
  in_channels: 1
  out_channels: 1
  base_channels: 8                # inherited from the [44] architecture; C not disclosed here
  use_emsfa: true
  use_dilated: true
  attention_reduction: 16         # engineering_default
  spatial_kernel: 7               # engineering_default
  dilation_rates: [1, 2, 4, 8]    # source: Eq. (10)
  output_activation: sigmoid      # source: Fig. 2
  # Dataset-II validated interpretation; see README for the Eq. (9)-(11) ambiguity.
  dilated_branch_block: conv_in_lrelu
  residual_order: add_then_activate
  transition_block: conv_in_lrelu

training:
  epochs: 100                     # source: Section III-A
  batch_size: 4                   # source: Section III-A
  learning_rate: 0.001            # source: Section III-A
  lr_decay: 0.98                  # value: paper; per-epoch ExponentialLR: engineering_default
  optimizer: adam                 # source: Section III-A
  loss: mae                       # source: Section II-B
  amp: true
  checkpoint_every: 10
  milestone_epochs: [1, 5, 10, 20, 30, 40, 60, 80, 100]
  selection_metric: mae
  collapse_std_threshold: 0.0001
  collapse_input_delta_threshold: 0.00001

finetune:
  epochs: 100                     # source: Section III-C
  learning_rate: 0.0001           # engineering_default; only "reduced" is reported
